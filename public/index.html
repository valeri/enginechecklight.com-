<style>
/* One phone-width app column, centred on wider screens; instrument-panel feel — steel neutrals, one warning-light orange. */
:root {
  --bg: #eef0ef; --surface: #ffffff; --sunken: #e3e6e5; --fg: #1c2023; --muted: #5d666b; --line: #cfd4d3;
  --accent: #d9480f; --accent-ink: #ffffff; --accent-soft: #fde7dc;
  --ok: #2b8a3e; --warn: #e67700; --high: #d9480f; --crit: #c92a2a;
  /* Inter for Latin; Georgian letters fall through to Noto Sans Georgian. One family everywhere. */
  --body: "Inter", "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--body);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121517; --surface: #1b1f22; --sunken: #23282b; --fg: #e8ecec; --muted: #9aa4a8; --line: #30373b;
  --accent: #ff7a3d; --accent-ink: #1b0d05; --accent-soft: #3a2116;
  --ok: #51cf66; --warn: #fcc419; --high: #ff7a3d; --crit: #ff6b6b; color-scheme: dark } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
.app { max-width: 440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: 120px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.01em; text-wrap: balance; margin: 0; line-height: 1.3; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px 20px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: clamp(21px, 6.4vw, 28px); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wordmark span { color: var(--accent); }
.lamp { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.tools { display: flex; align-items: center; gap: 6px; flex: none; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.cr { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap; }
.cr svg { color: var(--accent); }
.cr .plus { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 14px; line-height: 1; margin-left: 2px; }
.cr.low { animation: crpulse 1.6s ease-in-out 3; }
@keyframes crpulse { 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .cr.low { animation: none; } }
.credit-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; border: 2px solid var(--accent); background: var(--accent-soft); }
.credit-card .primary { width: auto; padding: 12px 18px; }
.cost-line { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.packs { display: grid; gap: 12px; }
.pack { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; }
.pack.pop { border: 2px solid var(--accent); padding: 15px; }
.pack .n { font-size: 22px; font-weight: 800; }
.pack .n small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.pack .per { grid-column: 1; font-size: 13px; color: var(--muted); }
.pack .p { grid-row: 1; grid-column: 2; font-size: 20px; font-weight: 800; text-align: right; }
.pack .primary { grid-column: 1 / -1; margin-top: 8px; padding: 13px; }
.pack .primary:disabled { opacity: .55; cursor: default; }
.pack .badge { position: absolute; top: -10px; left: 14px; font-size: 11px; font-weight: 800; letter-spacing: .04em; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 10px; }
.acct { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; }
.acct.on { border-color: var(--accent); color: var(--accent); font-weight: 700; font-size: 14px; }
.back { border: 0; background: none; cursor: pointer; padding: 6px 0; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

.tag { color: var(--muted); margin: -12px 0 24px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.hist { display: grid; grid-template-columns: 14px 1fr; gap: 4px 12px; text-align: left; width: 100%; cursor: pointer; }
.hist:hover { border-color: var(--accent); }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; }
.hist .t { font-weight: 600; min-width: 0; }
.hist .s { grid-column: 2; color: var(--muted); font-size: 13px; }
.example { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--sunken); color: var(--muted); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
.empty { text-align: center; padding: 28px 16px; }
.empty h2 { font-size: 21px; margin: 12px 0 6px; }

.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; padding: 15px 26px; border-radius: 999px; cursor: pointer; box-shadow: 0 8px 24px rgb(0 0 0 / .18); display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row.yr { grid-template-columns: 96px 1fr; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 12px; font-size: 16px; }
.field textarea { resize: vertical; min-height: 80px; }
.code-in { font-family: var(--mono); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 18px !important; }

.sec-h { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; }
.sec-h svg { color: var(--accent); }
.anatomy { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.anatomy span { font-family: var(--mono); font-size: 12px; background: var(--sunken); border-radius: 6px; padding: 3px 7px; }
.anatomy b { color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }

.btn-o { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.preview { position: relative; }
.preview img { width: 100%; height: 170px; object-fit: cover; border-radius: 10px; display: block; }
.preview button { position: absolute; top: 8px; right: 8px; border: 0; border-radius: 50%; width: 32px; height: 32px; background: var(--surface); cursor: pointer; font-size: 16px; }

.scan-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pro { font-size: 11px; font-weight: 800; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); border-radius: 5px; padding: 1px 6px; }
.found { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.found .chip { font-family: var(--mono); font-weight: 700; letter-spacing: .06em; }
.plan-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--accent); }
.primary { width: 100%; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 16px; font-weight: 700; font-size: 16px; cursor: pointer; }
.primary:disabled { opacity: .5; cursor: default; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.err { color: var(--crit); font-size: 14px; margin: 0; }

.thinking { min-height: 60vh; display: grid; place-items: center; text-align: center; gap: 16px; }
.gauge { width: 120px; height: 66px; }
.gauge .needle { transform-origin: 60px 60px; animation: sweep 1.6s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: rotate(-70deg); } to { transform: rotate(70deg); } }
@media (prefers-reduced-motion: reduce) { .gauge .needle { animation: none; } }

.verdict h2 { font-size: 20px; font-weight: 700; line-height: 1.35; }
.safe { display: grid; grid-template-columns: 26px 1fr; gap: 10px; border-radius: var(--r); padding: 14px; margin-top: 16px; background: var(--sunken); border-left: 6px solid var(--c); }
.safe b { color: var(--c); }
.sev { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c); margin-bottom: 8px; }
.h3 { font-family: var(--display); font-size: 18px; font-weight: 700; margin: 24px 0 8px; }
.cause { display: flex; flex-direction: column; gap: 5px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.cause:last-child { border-bottom: 0; }
.cause .top { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.cause .pct { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.cause p { margin: 0; color: var(--muted); font-size: 14px; }
.cost { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.cost small { font-size: 16px; color: var(--muted); font-weight: 600; margin-right: 4px; }
ul.list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.cx-code { font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: .06em; line-height: 1.1; margin-bottom: 6px; }
.cx-code span { color: var(--accent); }
.cx-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
.cx-row .k { color: var(--muted); }
.cx-row .v { min-width: 0; overflow-wrap: anywhere; }
.cx-ftb { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
.cx-ftb b { font-family: var(--mono); color: var(--accent); }
.cx-ftb p { margin: 4px 0 0; }
.cx-what { margin: 12px 0 0; }
.cx-look { margin-top: 12px; }
.cx-look .label { margin-bottom: 6px; }
.unsure { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--sunken); color: var(--warn); border-radius: 5px; padding: 2px 7px; margin-left: 8px; vertical-align: middle; }
.disc { margin-top: 28px; font-size: 12px; color: var(--muted); }

.pw { text-align: center; }
.pw h2 { font-size: 30px; font-weight: 800; margin-top: 10px; }
.plan { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; cursor: pointer; }
.plan[aria-pressed="true"] { border: 2px solid var(--accent); padding: 15px; }
.plan .n { flex: 1; font-weight: 600; }
.plan .p { font-family: var(--mono); font-weight: 700; }
.plan .save { font-size: 12px; color: var(--accent); font-weight: 700; display: block; }
.soon { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pw-list { text-align: left; margin: 24px 0; }
.link { border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 8px; font-size: inherit; }
a { color: inherit; }
.banner { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; margin-bottom: 18px; }
.banner.demo { background: var(--sunken); }
.ok-box { background: var(--sunken); border-radius: var(--r); padding: 16px; text-align: left; }
.foot { margin-top: 36px; font-size: 12px; color: var(--muted); text-align: center; }
.install { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; margin-bottom: 18px; border-color: var(--accent); }
.install img { width: 44px; height: 44px; border-radius: 10px; display: block; }
.install b { display: block; }
.install .note { margin: 2px 0 0; }
.install .x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px 6px; align-self: start; }
.install .primary { grid-column: 1 / -1; padding: 12px; font-size: 16px; }
.install ol { grid-column: 1 / -1; margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.install ol svg { vertical-align: -3px; color: var(--accent); }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 10; max-width: calc(100% - 32px); text-align: center; }
/* live research: source tiers and links */
.tier { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; background: var(--sunken); color: var(--muted); border-radius: 5px; padding: 2px 7px; vertical-align: middle; }
.tier.off { color: var(--ok); }
.src { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.src a { color: var(--accent); }
.srcs { display: flex; flex-direction: column; gap: 8px; }
.srcs .tier { margin-bottom: 4px; }
.searching { display: flex; align-items: center; gap: 14px; }
.searching .gauge { width: 64px; flex: none; }
.notfound { border-left: 4px solid var(--warn); }
</style>

// ---------- API ----------
async function api(path, body) {
  const opts = { credentials: "same-origin", headers: {} };
  if (body !== undefined) { opts.method = "POST"; opts.headers["content-type"] = "application/json"; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(path, opts); } catch (_) { return { ok: false, status: 0, data: { error: "network" } }; }
  let data = {};
  try { data = await res.json(); } catch (_) {}
  return { ok: res.ok, status: res.status, data };
}

const checkBody = (f, dc, step) => ({ step, lang: S.lang, code: dc.c, make: f.make.trim(), model: f.model.trim(), year: f.year.trim(), engine: f.engine.trim(), text: f.text.trim() });
const diagnoseBasic = (f, dc) => api("/api/check", checkBody(f, dc, "basic"));

const diagnoseExtended = (f, dc) => api("/api/check", checkBody(f, dc, "research"));

// Same rule as src/dtc.js: base code plus optional failure type, canonical form "B143C-11".
function decodeCode(raw) {
  const m = /^([PCBU][0-3][0-9A-F]{3})(?:[\s:\-_.]*([0-9A-F]{2}))?$/.exec((raw || "").trim().toUpperCase());
  if (!m) return null;
  const base = m[1], ftb = m[2] || null;
  return { c: ftb ? `${base}-${ftb}` : base, base, ftb, sys: t("sys")[base[0]], generic: base[1] === "0" || base[1] === "2" };
}
// Shrink a photo to at most 1568 px on the long side and send it as JPEG (well under the 4 MB limit).
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3800);
}

// Chrome, Edge and Samsung Internet fire beforeinstallprompt: we keep it and show our own button.
// iOS has no install API, so there we show the Share → Add to Home Screen steps instead.
let installPrompt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const canInstall = () => !isStandalone() && (installPrompt || isIOS);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; if (!S.loading) render(true); });
window.addEventListener("appinstalled", () => { installPrompt = null; toast(t("installed")); if (!S.loading) render(true); });

async function installApp() {
  if (installPrompt) {
    const p = installPrompt;
    p.prompt();
    const { outcome } = await p.userChoice;
    if (outcome === "accepted") installPrompt = null;
    render(true); return;
  }
  // iOS: open the banner with the steps.
  S.install = { hidden: false, help: true }; LS.set("ecl-install-hidden", false);
  if (S.view !== "home") go("home"); else render(true);
}

  const sIcon = { yes: icons.check, short_distance: icons.warn }[d.safe_to_drive] || icons.stop;

  return `${topbar(true)}
  ${S.current.demo ? demoBanner() : ""}
  <div class="verdict" style="--c:${c}">
    <div class="sev">● ${t("sev_" + d.severity) || esc(d.severity)} ${t("severity")}</div>
    <h2>${esc(d.summary)}</h2>
    <div class="safe"><span style="color:${c}">${sIcon}</span><div><b>${t("safe_" + d.safe_to_drive) || esc(d.safe_to_drive)}</b><div>${esc(d.safety_note)}</div></div></div>
  </div>
  ${codeExplained(d)}
  <div class="h3">${t("causes")}</div>
  <div class="panel">${(d.causes || []).map(x => { const p = Math.round(Math.max(0, Math.min(1, Number(x.likelihood) || 0)) * 100); return `<div class="cause"><div class="top"><span>${esc(x.name)}</span><span class="pct">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div><p>${esc(x.explanation)}</p></div>`; }).join("")}</div>
  ${rc && rc.low != null ? `<div class="h3">${t("cost")}</div><div class="cost"><small>${esc(rc.currency || "USD")}</small>${Math.round(rc.low)}–${Math.round(rc.high)}</div><p class="note">${esc(rc.note)}</p>` : ""}
  ${d.diy_checks?.length ? `<div class="h3">${t("checks")}</div><ul class="list">${d.diy_checks.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
  ${d.questions?.length ? `<div class="h3">${t("questions")}</div><ul class="list">${d.questions.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
  <p class="disc">${esc(creditLine())}<br>${esc(d.disclaimer)}</p>${footer()}`;
}

function viewCredits() {
  const fmt = (n, cur) => cur === "GEL" ? `${Number(n).toFixed(Number.isInteger(n) ? 0 : 2)} ₾` : `${Number(n).toFixed(2)} ${cur}`;
  const packs = S.me.packs || [];
  return `${topbar(true)}<div class="pw">
    <h2>${t("creditsT")}</h2><p class="note" style="margin:8px 0 18px">${t("creditsS")}</p>
    ${S.notice ? `<div class="banner" role="status">${esc(S.notice)}</div>` : ""}
    ${S.me.user && !cr().unlimited ? `<p style="margin:0 0 16px">${t("balanceLabel")}: <b>${cr().balance}</b> ${t("creditsWord")(cr().balance)}</p>` : ""}
    ${!S.me.user ? creditCard() : ""}
    <div class="packs">${packs.map(p => `<div class="pack${p.popular ? " pop" : ""}">
      ${p.popular ? `<span class="badge">${t("popular")}</span>` : ""}
      <div class="n">${p.credits}<small>${t("creditsWord")(p.credits)}</small></div>
      <div class="p">${p.price != null ? fmt(p.price, p.currency) : "—"}</div>
      <div class="per">${p.price != null ? t("perCredit")(fmt(p.price / p.credits, p.currency)) : ""}</div>
      <button class="primary" data-buy="${esc(p.id)}" ${p.buyable && !S.buying ? "" : "disabled"}>${p.buyable ? `${icons.bolt} ${t("buy")}` : t("soon")}</button>
    </div>`).join("")}</div>
  </div>${footer()}`;
}

function viewAccount() {
  const u = S.me.user, a = S.auth;
  if (u) return `${topbar(true)}<h2 style="font-size:24px;font-weight:800;margin-bottom:18px">${t("signInT")}</h2>
    <div class="stack"><div class="panel"><b>${esc(t("signedAs")(u.email))}</b><p class="note" style="margin-top:4px">${esc(creditLine())}</p></div>
    ${cr().unlimited ? "" : `<button class="primary" data-go="credits">${icons.bolt} ${t("buyCredits")}</button>`}
    <button class="btn-o" data-act="logout" style="align-self:flex-start">${t("signOut")}</button></div>${footer()}`;
  if (!S.me.features.login) return `${topbar(true)}<p>${t("loginOff")}</p>`;
  return `${topbar(true)}<h2 style="font-size:24px;font-weight:800;margin-bottom:10px">${t("signInT")}</h2>
  <p class="note" style="margin-bottom:18px">${t("signInS")}</p>
  ${S.notice ? `<div class="banner" role="status">${esc(S.notice)}</div>` : ""}
  ${a.sent ? `<div class="stack"><div class="ok-box" role="status">${esc(t("checkMail")(a.email))}</div>
      ${a.devLink ? `<a class="btn-o" href="${esc(a.devLink)}" style="align-self:flex-start">${t("devLink")}</a>` : ""}
      <button class="link" data-act="authreset" style="align-self:flex-start;padding-left:0">${t("useOther")}</button></div>`
  : `<form class="stack" data-form="auth" novalidate>
      <div class="field"><label for="aemail">${t("email")}</label><input id="aemail" type="email" autocomplete="email" required value="${esc(a.email)}"></div>
      ${a.err ? `<p class="err" role="alert">${esc(a.err)}</p>` : ""}
      <button class="primary" type="submit" ${a.busy ? "disabled" : ""}>${t("sendLink")}</button>
    </form>`}${footer()}`;
}

const app = document.getElementById("app");
function render(keepScroll) {
  document.documentElement.lang = S.lang;
  app.innerHTML = { home: viewHome, new: viewNew, thinking: viewThinking, result: viewResult, credits: viewCredits, account: viewAccount }[S.view]();
  if (!keepScroll) window.scrollTo(0, 0);
}
function go(view) { S.view = view; S.error = ""; if (view !== "credits" && view !== "account") S.notice = ""; render(); }

// ---------- actions ----------
async function scanCode(file) {
  if (!S.me.user) { S.notice = t("scanLogin"); S.view = "account"; render(); return; }
  S.scan = { busy: true, codes: null, msg: "" }; render(true);
  let image;
  try { image = await compressImage(file); } catch (_) { S.scan = { busy: false, codes: null, msg: t("errors").photoBad }; render(true); return; }
  const r = await api("/api/scan-code", { image });
  if (!r.ok) {
    if (r.data.error === "login_required") { S.scan.busy = false; S.notice = t("scanLogin"); S.view = "account"; render(); return; }
    S.scan = { busy: false, codes: null, msg: r.status === 0 ? t("errors").network : t("errors").scan_failed }; render(true); return;
  }
  const codes = (r.data.codes || []).map(c => c.code).filter(Boolean);
  if (!codes.length) { S.scan = { busy: false, codes: null, msg: t("scanNone") }; render(true); return; }
  S.form.code = codes[0];
  S.scan = { busy: false, codes, msg: codes.length > 1 ? t("scanFound") : t("scanGot")(codes[0]) };
  render(true);
}

// A code without photo or sound: exact breakdown at once (free), then live research (one check).
async function codeCheck(f, dc) {
  LS.set("ecl-car", { make: f.make, model: f.model, year: f.year, engine: f.engine });
  S.error = ""; S.view = "thinking"; render();
  const b = await diagnoseBasic(f, dc);
  if (!b.ok) {
    S.view = "new";
    S.error = b.status === 0 ? t("errors").network : { invalid_code: t("badCode"), need_code_or_text: t("needInput") }[b.data.error] || t("errors").failed;
    render(); return;
  }
  const cur = { kind: "research", status: "loading", form: { ...f, photo: null, photoUrl: null }, dc, basic: { code: b.data.code, nhtsa: b.data.nhtsa },
    req: { make: f.make, model: f.model, year: f.year, code: dc.c } };
  S.current = cur; S.view = "result";
  // keep the car for next time, clear the symptoms
  S.form = { ...blankForm(), make: f.make, model: f.model, year: f.year, engine: f.engine };
  S.scan = { busy: false, codes: null, msg: "" };
  render();
  await runResearch(cur);
}

// Shared error handling for the quick and the extended search. Returns true when handled.
function researchError(cur, r, show) {
  if (r.data.error === "no_credits") { cur.status = "out"; if (S.current === cur) goBuy(); return; }
  if (r.data.error === "invalid_code" || r.data.error === "need_code_or_text") { S.form = cur.form; S.view = "new"; S.error = r.data.error === "invalid_code" ? t("badCode") : t("needInput"); render(); return; }
  cur.status = "error";
  cur.err = r.status === 0 ? t("errors").network : t("rerrors")[r.data.error] || t("rerrors").research_failed;
  show();
}

async function runResearch(cur) {
  const show = () => { if (S.current === cur && S.view === "result") render(true); };
  if (!canCheck()) { cur.status = "out"; show(); return; }
  cur.status = "loading"; cur.canExtend = false; cur.extendIncluded = false; show();
  const r = await diagnoseResearch(cur.form, cur.dc);
  setCredits(r.data.credits);
  if (!r.ok) { cur.canExtend = Boolean(r.data.can_extend); researchError(cur, r, show); return; }
  Object.assign(cur, { status: "done", d: r.data.diagnosis, cached: Boolean(r.data.cached), researchedAt: r.data.researched_at, basic: { code: r.data.code || cur.basic.code, nhtsa: r.data.nhtsa || cur.basic.nhtsa } });
  // No confirmed definition: show what was found, offer the extended search, keep it out of Recent.
  if (r.data.can_extend) { cur.canExtend = true; cur.extendIncluded = Boolean(r.data.extend_included); show(); return; }
  finishResearch(cur, r.data.item);
}

// Extended search: background job on the server, polled every 4 seconds.
async function extendResearch(cur) {
  const show = () => { if (S.current === cur && S.view === "result") render(true); };
  if (!cur.extendIncluded && !canCheck()) { cur.status = "out"; show(); return; }
  cur.status = "extending"; cur.canExtend = false; show();
  let r = await diagnoseExtended(cur.form, cur.dc);
  setCredits(r.data.credits);
  if (r.status === 202) {
    const id = r.data.jobId, until = Date.now() + 17 * 60_000;
    let misses = 0;
    for (;;) {
      await new Promise(res => setTimeout(res, 4000));
      r = await pollJob(id);
      if (r.status === 0 && ++misses < 5 && Date.now() < until) continue; // brief connection loss: keep polling
      if (!r.ok || r.data.status === "done" || r.data.status === "failed" || Date.now() > until) break;
    }
    setCredits(r.data.credits);
    if (r.ok && r.data.status === "failed") r = { ok: false, status: 502, data: { error: r.data.error } };
    else if (r.ok && r.data.status !== "done") r = { ok: false, status: 504, data: { error: "research_failed" } };
  }
  if (!r.ok) { cur.canExtend = true; researchError(cur, r, show); return; }
  const prevBasic = cur.basic;
  Object.assign(cur, { status: "done", d: r.data.diagnosis, cached: Boolean(r.data.cached), researchedAt: r.data.researched_at,
    basic: { code: r.data.code || prevBasic.code, nhtsa: r.data.nhtsa || prevBasic.nhtsa } });
  finishResearch(cur, r.data.item);
}

function finishResearch(cur, item) {
  item = item || {};
  const entry = { id: item.id, at: item.at || Date.now(), req: item.req || cur.req, kind: "research", d: cur.d, basic: cur.basic, cached: cur.cached, researchedAt: cur.researchedAt };
  Object.assign(cur, { id: entry.id, at: entry.at });
  S.history.unshift(entry);
  if (!S.me.user) LS.set("ecl-history", S.history.slice(0, 20));
  if (S.current === cur) S.current = entry;
  if (S.view === "result" && S.current === entry) render(true);
}

// The server's bad_input message is English and technical: show our own text in the chosen language.
const badInputText = m => /code/i.test(m || "") ? t("badCode") : /image|photo/i.test(m || "") ? t("errors").photoBad : t("needInput");

async function diagnose() {
  const f = S.form, dc = decodeCode(f.code);
  if (f.code.trim() && !dc) { S.error = t("badCode"); render(true); return; }
  if (!dc && !f.text.trim() && !f.sound && !f.photo) { S.error = t("needInput"); render(true); return; }
  if (dc && !f.sound && !f.photo) { codeCheck(f, dc); return; }
  if (!canCheck()) { goBuy(); return; }
  LS.set("ecl-car", { make: f.make, model: f.model, year: f.year, engine: f.engine });
  S.error = ""; S.view = "thinking"; render();

  const body = { lang: S.lang, car: { make: f.make, model: f.model, year: f.year ? Number(f.year) : undefined, engine: f.engine } };
  if (dc) body.code = dc.c;
  if (f.sound) body.sound = { type: f.sound, when: f.when };
  if (f.text.trim()) body.text = f.text.trim();
  if (f.photo) {
    try { body.image = await compressImage(f.photo); } catch (_) { S.view = "new"; S.error = t("errors").photoBad; render(); return; }
  }
  const r = await api("/api/diagnose", body);
  if (!r.ok) {
    setCredits(r.data.credits);
    if (r.data.error === "no_credits") { goBuy(); return; }
    S.view = "new";
    S.error = r.status === 0 ? t("errors").network : r.data.error === "bad_input" ? badInputText(r.data.message) : t("errors").failed;
    render(); return;
  }
  const { item, meta, ...d } = r.data;
  setCredits(meta?.credits);
  const entry = { id: item.id, at: item.at, req: item.req, d };
  S.history.unshift(entry);
  if (!S.me.user) LS.set("ecl-history", S.history.slice(0, 20));
  S.current = { ...entry, demo: !meta?.live };
  // keep the car for next time, clear the symptoms
  S.form = { ...blankForm(), make: f.make, model: f.model, year: f.year, engine: f.engine };
  if (f.photoUrl) URL.revokeObjectURL(f.photoUrl);
  S.scan = { busy: false, codes: null, msg: "" };
  S.view = "result"; render();
}

// Buy a pack: the server returns the payment page; credits arrive after the payment is confirmed.
async function buyPack(id) {
  if (!S.me.user) { goBuy(); return; }
  S.buying = true; S.notice = ""; render(true);
  const r = await api("/api/credits/checkout", { packId: id });
  S.buying = false;
  if (r.ok && r.data.url) { location.href = r.data.url; return; }
  if (r.data.error === "login_required") { goBuy(); return; }
  S.notice = r.data.error === "payments_unavailable" || r.data.error === "pack_unavailable" ? t("payUnavailable") : r.status === 0 ? t("errors").network : t("checkoutFailed");
  render(true);
}

async function startAuth(email) {
  S.auth = { ...S.auth, email, busy: true, err: "" }; render(true);
  const r = await api("/api/auth/start", { email, lang: S.lang });
  S.auth.busy = false;
  if (r.ok) { S.auth.sent = true; S.auth.devLink = r.data.devLink || ""; }
  else S.auth.err = { bad_email: t("badEmail"), too_many: t("tooMany"), login_unavailable: t("loginOff"), network: t("errors").network }[r.data.error] || t("errors").network;
  render(true);
}

async function joinWaitlist(email) {
  S.wait = { ...S.wait, email, busy: true, err: "" }; render(true);
  const r = await api("/api/waitlist", { email, lang: S.lang, plan: S.yearly ? "yearly" : "monthly" });
  S.wait.busy = false;
  if (r.ok) S.wait.done = true;
  else S.wait.err = { bad_email: t("badEmail"), too_many: t("tooMany"), network: t("errors").network }[r.data.error] || t("errors").network;
  render(true);
}

app.addEventListener("click", async e => {
  const el = e.target.closest("button, [data-go]");
  if (!el || (el.type === "submit" && el.form)) return;
  if (el.dataset.lang) { S.lang = el.dataset.lang; LS.set("ecl-lang", S.lang); render(true); return; }
  if (el.dataset.go) {
    go(el.dataset.go); return;
  }
  if (el.dataset.open != null) { S.current = S.history[+el.dataset.open]; go("result"); return; }
  if (el.dataset.sound) { S.form.sound = S.form.sound === el.dataset.sound ? null : el.dataset.sound; if (!S.form.sound) S.form.when = []; render(true); return; }
  if (el.dataset.when) { const w = el.dataset.when, a = S.form.when; S.form.when = a.includes(w) ? a.filter(x => x !== w) : [...a, w]; render(true); return; }
  if (el.dataset.buy) { buyPack(el.dataset.buy); return; }
  if (el.dataset.pick) { S.form.code = el.dataset.pick; render(true); return; }
  const act = el.dataset.act;
  if (act === "rmphoto") { if (S.form.photoUrl) URL.revokeObjectURL(S.form.photoUrl); S.form.photo = null; S.form.photoUrl = null; render(true); return; }
  if (act === "diagnose") { diagnose(); return; }
  if (act === "retry" && S.current?.kind === "research" && S.current.form) { runResearch(S.current); return; }
  if (act === "extend" && S.current?.kind === "research" && S.current.form) { extendResearch(S.current); return; }
  if (act === "install") { installApp(); return; }
  if (act === "installhide") { S.install = { hidden: true, help: false }; LS.set("ecl-install-hidden", true); render(true); return; }
  if (act === "scanlogin") { S.notice = t("scanLogin"); S.view = "account"; render(); return; }
  if (act === "buy-start") { goBuy(); return; }
  if (act === "authreset") { S.auth = { email: S.auth.email, sent: false, devLink: "", busy: false, err: "" }; render(true); return; }
  if (act === "logout") {
    await api("/api/auth/logout", {});
    S.history = LS.get("ecl-history", []);
    await loadMe(); go("home"); return;
  }
});
app.addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target.dataset.form;
  if (form === "auth") startAuth(document.getElementById("aemail").value.trim());
  if (form === "wait") joinWaitlist(document.getElementById("wemail").value.trim());
});
app.addEventListener("input", e => {
  const k = e.target.dataset.f; if (!k) return;
  S.form[k] = e.target.value;
  if (k === "code") document.getElementById("anatomy").innerHTML = anatomy(decodeCode(e.target.value));
});
app.addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (e.target.id === "scanIn") { scanCode(file); return; }
  if (e.target.id === "photo") {
    if (S.form.photoUrl) URL.revokeObjectURL(S.form.photoUrl);
    S.form.photo = file; S.form.photoUrl = URL.createObjectURL(file); render(true);
  }
});

(async () => {
  const p = new URLSearchParams(location.search);
  const login = p.get("login");
  if (login) history.replaceState(null, "", location.pathname);
  await loadMe();
  S.loading = false;
  render();
  if (login === "ok" && S.me.user) toast(t("loginOk"));
  if (login === "expired") { S.view = "account"; render(); toast(t("loginBad")); }
})();

// localhost too, so the install button can be tested with npm run dev.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/sw.js").catch(() => {});
